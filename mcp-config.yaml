# MCP tool exposure config
#
# Lists OpenAPI operations that exist in the REST API but should not be
# exposed as MCP tools. Anything not listed here is emitted as a tool by
# the regen script.
#
# Add an operationId (or an exact path) under `exclude` with a short
# reason when an endpoint is admin-only, deprecated, or not safe to put
# behind an LLM.
exclude:
  # Match by exact path string.
  paths: []

  # Match by OpenAPI operationId.
  operation_ids:
    # Simulations are an under-supported, undocumented feature. Kept off
    # the MCP surface until they are documented and stable.
    - listSimulations
    - createSimulation
    - getSimulation
    - updateSimulation
    - deleteSimulation
    - startSimulation
    - stopSimulation
    - applyEnhancedPrompt
    - generateAutoScenarios
    # Authoring helper, not a runtime action for an agent to call.
    - enhancePrompt
    # Reseller operations: admin-level actions on other people's accounts.
    # Several move money and the KYC ones relay identity documents. Not
    # safe to put behind an LLM.
    - listChildOrganizations
    - addUser
    - setUserAccessControl
    - setUserExpiry
    - setChildConcurrency
    - calculateCreditOperation
    - transferCreditsToChild
    - revertCreditsFromChild
    - getResellerCreditLogs
    - getResellerKycStatus
    - getResellerKycRequirements
    - submitResellerKycStep
    # Client access and keys: block or release a client, and issue or revoke
    # the credentials its own system calls with.
    - setClientAccess
    - previewClientRelease
    - releaseClient
    - issueChildApiKey
    - revokeChildApiKey
    # Brand identity and SMTP: changes what a reseller's clients see and
    # routes their email through the reseller's own mail server.
    - getResellerIdentity
    - saveResellerIdentity
    - saveResellerIdentitySmtp
    - testResellerIdentitySmtp
    - disableResellerIdentitySmtp
    # Usage and margin: the reseller's wholesale cost and profit on each
    # client. Business data for the reseller alone, not agent context.
    - getResellerUsage
    - getResellerClientUsage

  # Parameters to strip from operations that are otherwise exposed.
  # `user_id` on the phone number tools is the reseller "act on a client"
  # switch. The reseller tools themselves are excluded above, so leaving it
  # here would be the one remaining way to spend another account's balance,
  # or release their number, from an LLM. Callers keep it on the REST API
  # and in both SDKs.
  parameters:
    listPhoneNumbers: [user_id]
    searchPhoneNumbers: [user_id]
    purchasePhoneNumber: [user_id]
    releasePhoneNumber: [user_id]
