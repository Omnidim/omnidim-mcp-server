version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # One PR per week, not one per package. Packages that have to move
      # together fail by construction when split. Majors are grouped too but
      # kept apart, so one major cannot hold the routine bumps back.
      npm-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
      npm-major:
        patterns: ["*"]
        update-types:
          - major
    ignore:
      # zod 4 reshaped error types + renamed `.errors` → `.issues`. The
      # affected code lives in the auto-generated src/index.ts; revisit
      # once openapi-mcp-generator emits zod-4-compatible output.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # TypeScript 6 drops auto-included node types. Trivial fix in
      # tsconfig but the upgrade gains nothing right now.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]
