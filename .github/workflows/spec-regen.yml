# Regenerates the tool catalogue when the published spec moves.
#
# The spec repo dispatches here on merge. spec-drift.yml still runs weekly as
# a backstop, because GitHub disables a scheduled workflow after 60 days
# without repo activity.
#
# This opens a pull request and stops. It does not merge, and for this repo
# that is not caution, it is the exposure boundary: a new operation in the
# spec becomes a new tool every agent can call. Adding a capability to an
# agent surface is a decision, not a regeneration, so the PR says in its title
# when the regen would add or remove a tool and a person makes that call.

name: spec-regen

on:
  repository_dispatch:
    types: [spec-changed]
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Recorded before regenerating, so the PR can say what changed in terms
      # of capability rather than diff size.
      - name: Note which tools exist today
        run: node -e "const s=require('fs').readFileSync('src/index.ts','utf8');const t=[...s.matchAll(/^\s{2}\[\"(\w+)\", \{\$/gm)].map(m=>m[1]).sort();require('fs').writeFileSync('/tmp/before.json',JSON.stringify(t))"

      - run: npm run regen
      # No test step. The PR this opens is authored by the app, so ci.yml runs
      # the suite on it across every supported platform. Running it here too
      # would only mean a regen that breaks something arrives as no PR at all
      # instead of as a PR with red checks, which is the outcome that hides it.

      - name: Compare the tool list
        id: tools
        run: |
          node -e "
          const fs=require('fs');
          const before=new Set(JSON.parse(fs.readFileSync('/tmp/before.json','utf8')));
          const s=fs.readFileSync('src/index.ts','utf8');
          const after=new Set([...s.matchAll(/^\s{2}\[\"(\w+)\", \{\$/gm)].map(m=>m[1]));
          const added=[...after].filter(t=>!before.has(t)).sort();
          const gone=[...before].filter(t=>!after.has(t)).sort();
          const out=fs.createWriteStream(process.env.GITHUB_OUTPUT,{flags:'a'});
          out.write('added='+added.join(',')+'\n');
          out.write('gone='+gone.join(',')+'\n');
          out.write('title='+(added.length||gone.length
            ? 'chore: regenerate tools (EXPOSURE CHANGE: +'+added.length+' -'+gone.length+')'
            : 'chore: regenerate the tool catalogue from the updated spec')+'\n');
          "

      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          # Public identifier, useless without the key.
          app-id: "4881703"
          private-key: ${{ secrets.SPEC_BOT_PRIVATE_KEY }}

      # Opened as the app, not GITHUB_TOKEN, or the PR arrives with no checks.
      - name: Open a PR if the catalogue changed
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.token }}
          branch: chore/spec-regen
          delete-branch: true
          commit-message: "chore: regenerate the tool catalogue from the updated spec"
          title: ${{ steps.tools.outputs.title }}
          body: |
            The published OpenAPI spec changed and this regenerates the tool
            catalogue from it.

            **Tools added:** ${{ steps.tools.outputs.added || 'none' }}
            **Tools removed:** ${{ steps.tools.outputs.gone || 'none' }}

            If either list is non-empty this is a change to what agents can do,
            not just a refresh. Anything added is callable by every agent using
            this server the moment it publishes, so check it belongs on this
            surface before merging. To keep an operation off, add its
            `operationId` to `exclude.operation_ids` in `mcp-config.yaml` with
            a reason and regenerate.

            Publishing is still a `v*` tag by hand.

            With no exposure change this PR sets itself to auto-merge and
            lands once the required checks pass. An exposure change stays open
            for a person. Either way, publishing is still a `v*` tag by hand.

      # No EXPOSURE CHANGE in the title means no operation appeared or
      # vanished, so no agent gained or lost a capability and there is nothing
      # for a person to decide. An exposure change is left open on purpose.
      # Auto-merge still waits on the required checks and will not override a
      # red one; branch protection is what makes this safe.
      - name: Auto-merge a pure refresh once its checks pass
        if: steps.pr.outputs.pull-request-number != '' && !contains(steps.tools.outputs.title, 'EXPOSURE CHANGE')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --squash --delete-branch

      # A regen that dies before opening a PR leaves nothing behind, and a red
      # run in a tab nobody has open is how the spec drifted in the first
      # place. One issue, reused until it is closed.
      - name: Open an issue if the regen never produced a PR
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'spec-drift',
            });
            if (existing.data.length) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Spec regen failed: this surface is still on the old spec',
              labels: ['spec-drift'],
              body: `\`spec-regen\` failed on ${context.sha}. Either no PR was `
                + `opened, or one was opened and could not be set to auto-merge.\n\n`
                + `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                + `/actions/runs/${context.runId}`,
            });
