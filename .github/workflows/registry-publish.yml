name: registry-publish

# Publishes server.json to the official MCP Registry. ci.yml calls this after
# npm publish (the registry checks the npm package's mcpName), and it can be
# run by hand to republish the version on main.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_VERSION: v1.8.9
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # The io.github.Omnidim namespace is proven by this repo's OIDC identity, so no stored token expires.
      # npm takes minutes to list a new version, and the registry rejects a
      # version npm does not list yet (400 "version was not found").
      - name: Wait for npm to list this version
        timeout-minutes: 20
        run: |
          pkg=$(jq -r '.packages[0].identifier' server.json)
          ver=$(jq -r '.version' server.json)
          until [ "$(npm view "$pkg@$ver" version 2>/dev/null)" = "$ver" ]; do
            echo "Waiting for $pkg@$ver on npm"
            sleep 15
          done
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
